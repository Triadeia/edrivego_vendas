  <style>
    * { box-sizing: border-box; }
    html { background: #000; color: #fff; -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(100%, 720px); margin-inline: auto; padding: clamp(40px, 7vw, 72px) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    .brand { margin: 0 0 clamp(48px, 8vw, 80px); text-align: center; }
    .logo { display: block; width: min(100%, clamp(240px, 64vw, 440px)); height: auto; margin-inline: auto; filter: brightness(0) invert(1); }
    .links { position: relative; display: grid; gap: clamp(28px, 5vw, 56px); --tour-duration: 14s; --tour-ease: cubic-bezier(.45, 0, .2, 1); }
    .card { position: relative; isolation: isolate; display: grid; place-items: center; aspect-ratio: 8 / 3; min-height: 138px; padding: 24px 16px; overflow: hidden; border-radius: clamp(14px, 2.3vw, 22px); background: #17141b; color: #fff; text-align: center; text-decoration: none; box-shadow: 0 0 0 1px #873bd1, 0 0 16px rgba(135, 59, 209, .18); transform-origin: center; }
    .card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(0, 0, 0, .55); }
    .card-app::after { background: rgba(0, 0, 0, .30); }
    .media { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    video.media { opacity: 0; }
    video.is-playing { opacity: 1; }
    .copy { font-size: clamp(24px, 4.7vw, 44px); font-weight: 800; line-height: 1.14; letter-spacing: -.025em; text-wrap: balance; text-shadow: 0 2px 16px rgba(0, 0, 0, .45); }
    .copy span { display: block; }
    .copy .prompt { font-size: .76em; line-height: 1.45; letter-spacing: 0; }
    .card-app .copy { font-size: clamp(22px, 4.2vw, 40px); }
    .card:focus-visible { outline: 3px solid #c8a5ff; outline-offset: 6px; }
    @media (hover: hover) { .card:hover { outline: 2px solid #b493dc; outline-offset: 4px; } }
    .edge-light { display: none; position: absolute; inset: 0; z-index: 2; padding: 1.5px; border-radius: inherit; pointer-events: none; }
    @supports ((mask-composite: exclude) or (-webkit-mask-composite: xor)) {
      .edge-light { display: block; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; }
    }
    .edge-light::before { content: ""; position: absolute; top: 50%; left: 50%; width: 115%; aspect-ratio: 1; background: conic-gradient(transparent 0deg 245deg, #8635d8 288deg, #cc95ff 320deg, #fff 335deg, transparent 360deg); transform: translate(-50%, -50%) rotate(0deg); }
    .floating-cursor { position: absolute; top: 0; left: 86%; z-index: 4; width: clamp(40px, 7vw, 58px); height: auto; overflow: visible; opacity: 0; pointer-events: none; filter: drop-shadow(4px 9px 4px rgba(0, 0, 0, .65)); transform-origin: 15% 8%; }
    .motion-ready:not(.motion-disabled) .edge-light::before { animation: edge-orbit 7s linear infinite; }
    .motion-ready:not(.motion-disabled) .card { animation-duration: var(--tour-duration); animation-timing-function: var(--tour-ease); animation-iteration-count: infinite; }
    .motion-ready:not(.motion-disabled) .card:nth-of-type(1) { animation-name: card-one; }
    .motion-ready:not(.motion-disabled) .card:nth-of-type(2) { animation-name: card-two; }
    .motion-ready:not(.motion-disabled) .card:nth-of-type(3) { animation-name: card-three; }
    .motion-ready:not(.motion-disabled) .floating-cursor { animation: cursor-tour var(--tour-duration) var(--tour-ease) infinite both; }
    .links.motion-paused .card, .links.motion-paused .floating-cursor, .links.motion-paused .edge-light::before,
    .links:focus-within .card, .links:focus-within .floating-cursor { animation-play-state: paused; }
    .links:focus-within .floating-cursor { visibility: hidden; }
    @media (hover: hover) and (pointer: fine) {
      .links:hover .card, .links:hover .floating-cursor { animation-play-state: paused; }
      .links:hover .floating-cursor { visibility: hidden; }
    }
    @keyframes edge-orbit { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes card-one { 0%, 6%, 32%, 100% { transform: scale(1); } 14%, 24% { transform: scale(1.025); } }
    @keyframes card-two { 0%, 36%, 62%, 100% { transform: scale(1); } 44%, 54% { transform: scale(1.025); } }
    @keyframes card-three { 0%, 66%, 92%, 100% { transform: scale(1); } 74%, 84% { transform: scale(1.025); } }
    @keyframes cursor-tour {
      0% { opacity: 0; transform: translate3d(4px, -36px, 0) rotate(-8deg) scale(.94); }
      6% { opacity: 1; }
      14%, 24% { opacity: 1; transform: translate3d(-4px, var(--cursor-one), 0) rotate(-3deg) scale(1.08); }
      44%, 54% { opacity: 1; transform: translate3d(2px, var(--cursor-two), 0) rotate(3deg) scale(1.08); }
      74%, 84% { opacity: 1; transform: translate3d(-4px, var(--cursor-three), 0) rotate(-3deg) scale(1.08); }
      93%, 100% { opacity: 0; transform: translate3d(4px, var(--cursor-end), 0) rotate(5deg) scale(.94); }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { video.media, .floating-cursor { display: none; } .links .card { animation: none !important; transform: none; } .links .edge-light::before { animation: none !important; } }
    @media (forced-colors: active) { .card { border: 2px solid LinkText; } .copy { text-shadow: none; } .edge-light, .floating-cursor { display: none; } }
  </style>

</head>
